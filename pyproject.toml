[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygpod"
version = "0.0.3"
description = "Pure Python library for iPod database management - a spiritual successor to libgpod"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
requires-python = ">=3.8"
authors = [
    {name = "Jörg Schuler"},
    {name = "Christophe Fergeau"},
    {name = "Yurii Kovrihin", email = "ukovrigin@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Bionded/pygpod"
Repository = "https://github.com/Bionded/pygpod"
Issues = "https://github.com/Bionded/pygpod/issues"

[project.optional-dependencies]
tags = ["mutagen"]
artwork = ["Pillow"]
usb = ["pyusb", "libusb; sys_platform == 'win32'"]
all = ["mutagen", "Pillow", "pyusb", "libusb; sys_platform == 'win32'"]

[project.scripts]
pygpod = "pygpod.cli:main"

[tool.setuptools.packages.find]
include = ["pygpod*"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
filterwarnings = [
    "ignore:Due to '_pack_':DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
