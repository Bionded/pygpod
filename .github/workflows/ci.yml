name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check pygpod/ tests/

      - name: Ruff format check
        run: ruff format --check pygpod/ tests/

  test-linux:
    name: Test (Python ${{ matrix.python-version }}, Linux)
    runs-on: ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            ubuntu: ubuntu-22.04
          - python-version: "3.9"
            ubuntu: ubuntu-latest
          - python-version: "3.10"
            ubuntu: ubuntu-latest
          - python-version: "3.11"
            ubuntu: ubuntu-latest
          - python-version: "3.12"
            ubuntu: ubuntu-latest
          - python-version: "3.13"
            ubuntu: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e ".[all]" pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=pygpod --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  test-macos:
    name: Test (Python ${{ matrix.python-version }}, macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: pip install -e ".[all]" pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  test-windows:
    name: Test (Python ${{ matrix.python-version }}, Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: pip install -e ".[all]" pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -k "not test_resolve_linux and not test_resolve_macos and not test_reads_proc_mounts"

  test-libgpod:
    name: Integration (libgpod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpod-dev libgpod-common ffmpeg gcc pkg-config \
            libglib2.0-dev

      - name: Install Python deps
        run: pip install -e ".[all]" pytest pytest-cov

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short

      # pygpod <-> libgpod interop (integration_tests/libgpod_tool.c): libgpod-written DBs read by pygpod
      # with identical hash58, pygpod-written DBs parsed by libgpod. Fails (does not skip) if it cannot run.
      - name: Verify against libgpod
        env:
          PYGPOD_REQUIRE_LIBGPOD: "1"
        run: python -m pytest tests/ -m libgpod -v --tb=short
